<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tic Tac Toe - Mini Arcade</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="game">

        <a
            href="../../index.html"
            class="back-button"
        >
            ← ARCADE
        </a>

        <header>
            <div class="badge">
                2 PLAYERS • LOCAL
            </div>

            <h1>TIC TAC TOE</h1>

            <p id="turn">
                Giliran Player X
            </p>
        </header>


        <section class="board" id="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </section>


        <div class="result" id="result"></div>

        <button
            id="restart"
            class="restart-button"
        >
            MAIN LAGI
        </button>

    </main>


    <script src="script.js"></script>

</body>

              </html>
