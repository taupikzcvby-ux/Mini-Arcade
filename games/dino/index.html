<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <div class="top-bar">
            <button class="back-button" onclick="goBack()">← Arcade</button>

            <div class="score">
                SCORE: <span id="score">0</span>
                <span class="best">BEST: <span id="best-score">0</span></span>
            </div>
        </div>

        <div id="game">

            <div id="sky"></div>
            <div id="stars"></div>

            <div id="sun" class="celestial">☀️</div>
            <div id="moon" class="celestial">🌙</div>

            <div class="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>

            <div id="dino" class="dino">
                <div class="dino-inner">
                    <div class="dino-tail"></div>
                    <div class="dino-body">
                        <div class="dino-eye"></div>
                    </div>
                    <div class="dino-head">
                        <div class="dino-mouth"></div>
                    </div>
                    <div class="dino-arm"></div>
                    <div class="dino-leg leg-back"></div>
                    <div class="dino-leg leg-front"></div>
                </div>
            </div>

            <div id="ground"></div>

            <div class="night-tint"></div>

            <div id="game-over">
                <h1>GAME OVER</h1>
                <p>Score: <span id="final-score">0</span></p>
                <p class="new-best" id="new-best">🏆 REKOR BARU!</p>
                <button onclick="restartGame()">MAIN LAGI</button>
            </div>

        </div>

        <div class="controls">
            <button id="jump-button">LOMPAT</button>
        </div>

        <p class="instruction">
            Tekan SPACE / ↑ atau tombol LOMPAT
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
