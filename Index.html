<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>MINI ARCADE</h1>
        <p>Kumpulan game kecil dalam satu website</p>
    </header>

    <main class="container">

        <h2>PILIH GAME</h2>

        <div class="game-grid">

            <div class="game-card">
                <div class="game-icon">🦖</div>
                <h3>Dino Runner</h3>
                <p>Lompat dan hindari rintangan.</p>
                <button onclick="openGame('dino')">MAIN</button>
            </div>

            <div class="game-card">
                <div class="game-icon">🐍</div>
                <h3>Snake</h3>
                <p>Makan makanan dan jadilah semakin panjang.</p>
                <button onclick="openGame('snake')">MAIN</button>
            </div>

            <div class="game-card">
                <div class="game-icon">🚀</div>
                <h3>Space Shooter</h3>
                <p>Tembak musuh dan raih skor tertinggi.</p>
                <button onclick="openGame('shooter')">MAIN</button>
            </div>

            <div class="game-card">
                <div class="game-icon">🧠</div>
                <h3>Memory Card</h3>
                <p>Temukan pasangan kartu yang sama.</p>
                <button onclick="openGame('memory')">MAIN</button>
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Mini Arcade</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
